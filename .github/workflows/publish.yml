name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test tests/Ambit.Core.Tests/Ambit.Core.Tests.csproj --no-build -c Release

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "Packing version $VERSION from tag"
            dotnet pack src/Ambit.Core/Ambit.Core.csproj -c Release --no-build -p:Version="$VERSION" -o ./nupkg
            dotnet pack src/Ambit.Avalonia/Ambit.Avalonia.csproj -c Release --no-build -p:Version="$VERSION" -o ./nupkg
          else
            echo "Manual dispatch - using csproj version"
            dotnet pack src/Ambit.Core/Ambit.Core.csproj -c Release --no-build -o ./nupkg
            dotnet pack src/Ambit.Avalonia/Ambit.Avalonia.csproj -c Release --no-build -o ./nupkg
          fi
          ls -lh ./nupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
